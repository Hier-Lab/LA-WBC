[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lawbc"
version = "0.1.0"
description = "Data processing, training, and cost-map analysis for LA-WBC"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "huggingface_hub>=0.34",  # provides the `hf` CLI
    "torch>=2.2",
]

[tool.setuptools.packages.find]
include = ["lawbc*"]

[tool.setuptools.package-data]
"lawbc.models" = ["*.yaml"]
